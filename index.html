function Products({token,user,bump}){const[rows,setRows]=useState([]),[search,setSearch]=useState(''),[sel,setSel]=useState([]),[modal,setModal]=useState(null),[warehouses,setW]=useState([]),[suppliers,setS]=useState([]);async function load(){setRows(await api(`/products?search=${encodeURIComponent(search)}`,token));setW(await api('/warehouses',token));setS(await api('/suppliers',token))}useEffect(()=>{load()},[search]);async function bulk(){if(!sel.length)return;await api('/products/bulk-delete',token,{method:'POST',body:{ids:sel}});setSel([]);load();bump()}return <div className="space-y-4"><div className="flex flex-wrap gap-2"><input className={cls+' max-w-sm'} placeholder="Search product / SKU / barcode" value={search} onChange={e=>setSearch(e.target.value)}/>{(user.role==='admin'||user.role==='manager')&&<button className={primary} onClick={()=>setModal({type:'form'})}>+ Add Product</button>}{user.role==='admin'&&<button className={btn} disabled={!sel.length} onClick={bulk}>Delete selected</button>}</div><div className="glass border border-white/10 rounded-xl overflow-auto"><table className="w-full text-sm"><thead><tr className="text-slate-500 border-b border-white/10"><th className="p-3"><input type="checkbox" checked={rows.length&&sel.length===rows.length} onChange={e=>setSel(e.target.checked?rows.map(x=>x.id):[])}/></th><th>SKU</th><th>Name</th><th>Stock</th><th>Cost</th><th>Sell</th><th>Margin</th><th>Status</th><th>Actions</th></tr></thead><tbody>{rows.map(p=>{const margin=Number(p.selling_price)-Number(p.purchase_price);return <tr className="border-b border-white/5" key={p.id}><td className="p-3"><input type="checkbox" checked={sel.includes(p.id)} onChange={e=>setSel(e.target.checked?[...sel,p.id]:sel.filter(x=>x!==p.id))}/></td><td>{p.sku}</td><td className="font-medium">{p.name}<div className="text-xs text-slate-500">{p.client_name||''}</div></td><td>{p.current_stock} <span className="text-xs text-slate-500">min {p.min_stock}</span></td><td>{money(p.purc function ProductForm({token,p,warehouses,suppliers,close,done}){const[v,setV]=useState({sku:p?.sku||'',barcode:p?.barcode||'',name:p?.name||'',brand:p?.brand||'',category:p?.category||'',unit:p?.unit||'pcs',purchasePrice:p?.purchase_price||0,sellingPrice:p?.selling_price||0,currentStock:p?.current_stock||0,minStock:p?.min_stock||0,warehouseId:p?.warehouse_id||'',supplierId:p?.supplier_id||'',clientName:p?.client_name||''});const[err,setErr]=useState('');async function go(e){e.preventDefault();try{await api(p?`/products/${p.id}`:'/products',token,{method:p?'PUT':'POST',body:v});done()}catch(e){setErr(e.message)}}return <Modal title={p?'Edit Product':'Add Product'} onClose={close}><form onSubmit={go} className="grid md:grid-cols-2 gap-3">{[['sku','SKU'],['barcode','Barcode'],['name','Product name'],['brand','Brand'],['category','Category'],['unit','Unit'],['purchasePrice','Purchase / cost price'],['sellingPrice','Selling price'],['minStock','Minimum stock'],['clientName','Client name']].map(x=><label className="text-xs text-slate-400" key={x[0]}>{x[1]}<input required={['sku','name'].includes(x[0])} type={['purchasePrice','sellingPrice','minStock'].includes(x[0])?'number':'text'} step="0.01" className={cls+' mt-1'} value={v[x[0]]} onChange={e=>setV({...v,[x[0]]:e.target.value})}/></label>)}{!p&&<label className="text-xs text-slate-400">Initial quantity<input type="number" min="0" className={cls+' mt-1'} value={v.currentStock} onChange={e=>setV({...v,currentStock:e.target.value})}/></label>}<label className="text-xs text-slate-400">Warehouse<select className={cls+' mt-1'} value={v.warehouseId} onChange={e=>setV({...v,warehouseId:e.target.value})}><option value="">None</option>{warehouses.map(x=><option value={x.id}>{x.name}</option>)}</select></label><label className="text-xs text-slate-400">Supplier<select className={cls+' mt-1'} value={v.supplierId} onChange={e=>setV({...v,supplierId:e.target.value})}><option value="">None</option>{suppliers.map(x=><option value={x.id function Stock({token,p,action,close,done}){const[v,setV]=useState({quantity:1,clientName:p.client_name||'',sellingPrice:p.selling_price||0,unitCost:p.purchase_price||0,note:''}),[err,setErr]=useState('');async function go(e){e.preventDefault();try{await api(`/inventory/${p.id}/${action}`,token,{method:'POST',body:v});done()}catch(e){setErr(e.message)}}return <Modal title={`${action==='stock-out'?'Sell':'Stock '+action} — ${p.name}`} onClose={close}><form onSubmit={go}><p className="text-sm text-slate-400 mb-3">Available: <b className="text-white">{p.current_stock}</b></p><label className="text-xs text-slate-400">Quantity<input type="number" min="1" required className={cls+' mt-1 mb-3'} value={v.quantity} onChange={e=>setV({...v,quantity:e.target.value})}/></label>{action==='stock-out'&&<><label className="text-xs text-slate-400">Client name<input className={cls+' mt-1 mb-3'} value={v.clientName} onChange={e=>setV({...v,clientName:e.target.value})}/></label><label className="text-xs text-slate-400">Selling price per unit<input type="number" min="0" step="0.01" className={cls+' mt-1 mb-3'} value={v.sellingPrice} onChange={e=>setV({...v,sellingPrice:e.target.value})}/></label></>}<label className="text-xs text-slate-400">Note<input className={cls+' mt-1 mb-3'} value={v.note} onChange={e=>setV({...v,note:e.target.value})}/></label>{action==='stock-out'&&<div className="glass p-3 rounded-lg text-sm mb-3">Total sale: <b>{money(Number(v.quantity)*Number(v.sellingPrice))}</b></div>}<div className="text-rose-400 text-sm mb-3">{err}</div><div className="flex justify-end gap-2"><button type="button" className={btn} onClick={close}>Cancel</button><button className={primary}>Confirm</button></div></form></Modal>}
function Warehouses({token,user}){const[rows,setRows]=useState([]),[sel,setSel]=useState([]),[m,setM]=useState(null);async function load(){setRows(await api('/warehouses',token))}useEffect(()=>{load()},[]);async function bulk(){await api('/warehouses/bulk',token,{method:'DELETE',body:{ids:sel}});setSel([]);load()}return <div className="space-y-4"><div className="flex gap-2"><button className={primary+' flex items-center gap-2'} onClick={()=>setM({})}><Icon name="plus" size={16}/> Add Warehouse</button>{user.role==='admin'&&<button className={btn} disabled={!sel.length} onClick={bulk}>Delete selected</button>}</div><div className="grid md:grid-cols-3 gap-4">{rows.map(w=><div className="glass border border-white/10 rounded-xl p-5" key={w.id}><div className="flex"><input type="checkbox" className="mr-2" checked={sel.includes(w.id)} onChange={e=>setSel(e.target.checked?[...sel,w.id]:sel.filter(x=>x!==w.id))}/><b>{w.name}</b></div><p className="text-sm text-slate-400 mt-2">{w.location}</p><p className="text-xs text-slate-500">Capacity: {w.capacity}</p><button className={btn+' mt-3'} onClick={()=>setM(w)}>Edit</button></div>)}</div>{m&&<WarehouseModal token={token} w={m} close={()=>setM(null)} done={()=>{setM(null);load()}}/>}</div>}
function WarehouseModal({token,w,close,done}){const[v,setV]=useState({name:w.name||'',location:w.location||'',capacity:w.capacity||0}),[e,setE]=useState('');async function go(x){x.preventDefault();try{await api(w.id?`/warehouses/${w.id}`:'/warehouses',token,{method:w.id?'PUT':'POST',body:v});done()}catch(e){setE(e.message)}}return <Modal title={w.id?'Edit Warehouse':'Add Warehouse'} onClose={close}><form onSubmit={go} className="space-y-3"><input className={cls} placeholder="Name" required value={v.name} onChange={e=>setV({...v,name:e.target.value})}/><input className={cls} placeholder="Location" value={v.location} onChange={e=>setV({...v,location:e.target.value})}/><input className={cls} type="number" placeholder="Capacity" value={v.capacity} onChange={e=>setV({...v,capacity:e.target.value})}/><p className="text-rose-400 text-sm">{e}</p><div className="text-right"><button className={primary}>Save</button></div></form></Modal>}
function Suppliers({token,user}){const[rows,setRows]=useState([]),[sel,setSel]=useState([]),[m,setM]=useState(null);async function load(){setRows(await api('/suppliers',token))}useEffect(()=>{load()},[]);async function bulk(){await api('/suppliers/bulk',token,{method:'DELETE',body:{ids:sel}});setSel([]);load()}return <div className="space-y-4"><div className="flex gap-2"><button className={primary+' flex items-center gap-2'} onClick={()=>setM({})}><Icon name="plus" size={16}/> Add Supplier</button>{user.role==='admin'&&<button className={btn} disabled={!sel.length} onClick={bulk}>Delete selected</button>}</div><div className="glass border border-white/10 rounded-xl overflow-auto"><table className="w-full text-sm"><thead><tr className="text-slate-500 border-b border-white/10"><th className="p-3"><input type="checkbox" checked={rows.length&&sel.length===rows.length} onChange={e=>setSel(e.target.checked?rows.map(x=>x.id):[])}/></th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Actions</th></tr></thead><tbody>{rows.map(s=><tr className="border-b border-white/5" key={s.id}><td className="p-3"><input type="checkbox" checked={sel.includes(s.id)} onChange={e=>setSel(e.target.checked?[...sel,s.id]:sel.filter(x=>x!==s.id))}/></td><td>{s.name}</td><td>{s.email}</td><td>{s.phone}</td><td>{s.address}</td><td><button className={btn} onClick={()=>setM(s)}>Edit</button></td></tr>)}</tbody></table></div>{m&&<SupplierModal token={token} s={m} close={()=>setM(null)} done={()=>{setM(null);load()}}/>}</div>}

function Notifications({token,openActivity,bump}){const[rows,setRows]=useState([]);async function load(){setRows(await api('/notifications',token))}useEffect(()=>{load()},[]);async function read(n){await api(`/notifications/${n.id}/read`,token,{method:'PUT'});await load();openActivity()}async function del(id){await api(`/notifications/${id}`,token,{method:'DELETE'});load();bump()}async function all(){await api('/notifications/bulk-delete',token,{method:'POST',body:{ids:rows.map(x=>x.id)}});load()}return <div className="space-y-3"><div className="flex justify-between"><p className="text-slate-400 text-sm">Unread/active notifications are shown for 24 hours. Activity remains permanently accessible.</p><button className={btn} onClick={all} disabled={!rows.length}>Delete all</button></div>{!rows.length&&<div className="text-slate-500">No active notifications.</div>}{rows.map(n=><div key={n.id} className="glass border border-white/10 rounded-xl p-4 flex justify-between gap-3"><button className="text-left flex-1" onClick={()=>read(n)}><b>{n.title}</b><p className="text-sm text-slate-400 mt-1">{n.message}</p><p className="text-xs text-slate-600 mt-1">{new Date(n.created_at).toLocaleString()}</p></button><button onClick={()=>del(n.id)} className="text-slate-500">×</button></div>)}</div>}

function Reports({token}){const[start,setStart]=useState(''),[end,setEnd]=useState(''),[title,setTitle]=useState('Inventory report'),[notes,setNotes]=useState('');async function dl(type,kind='inventory'){const q=`?start=${start}&end=${end}`;const r=await fetch(`${API}/reports/${kind}.${type}${q}`,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw Error('Report failed');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${kind}-report.${type==='xlsx'?'xlsx':type}`;a.click();URL.revokeObjectURL(url)}async function save(){await api('/reports',token,{method:'POST',body:{title,startDate:start||null,endDate:end||null,notes}});alert('Report saved')}return <div className="space-y-5"><div className="glass border border-white/10 rounded-xl p-5"><h3 className="font-medium mb-3">Generate report</h3><div className="grid md:grid-cols-2 gap-3"><label className="text-xs text-slate-400">From<input type="date" className={cls+' mt-1'} value={start} onChange={e=>setStart(e.target.value)}/></label><label className="text-xs text-slate-400">To<input type="date" className={cls+' mt-1'} value={end} onChange={e=>setEnd(e.target.value)}/></label></div><div className="flex flex-wrap gap-2 mt-4">{['pdf','csv','xlsx'].map(f=><button className={primary+' flex items-center gap-2'} onClick={()=>dl(f)} key={f}><Icon name="download" size={15}/> Download {f.toUpperCase()}</button>)}{['pdf','csv','xlsx'].map(f=><button className={btn+' flex items-center gap-2'} onClick={()=>dl(f,'overall')} key={'o'+f}><Icon name="report" size={15}/> Overall {f.toUpperCase()}</button>)}</div></div><div className="glass border border-white/10 rounded-xl p-5"><h3 className="font-medium mb-3">Manual report record</h3><input className={cls+' mb-2'} placeholder="Report title" value={title} onChange={e=>setTitle(e.target.value)}/><textarea className={cls+' mb-2'} placeholder="Notes / manual report description" value={notes} onChange={e=>setNotes(e.target.value)}/><button className={primary} onClick={save}>Save report record</button></div></div>}
function Users({token}){const[r,setR]=useState([]),[v,setV]=useState({username:'',name:'',role:'manager',password:''});async function load(){setR(await api('/users',token))}useEffect(()=>{load()},[]);async function add(e){e.preventDefault();await api('/users',token,{method:'POST',body:v});setV({username:'',name:'',role:'manager',password:''});load()}async function del(id){if(confirm('Disable this user?')){await api('/users/'+id,token,{method:'DELETE'});load()}}return <div className="space-y-5"><form onSubmit={add} className="glass border border-white/10 rounded-xl p-5 grid md:grid-cols-5 gap-2"><input className={cls} placeholder="Username" value={v.username} onChange={e=>setV({...v,username:e.target.value})} required/><input className={cls} placeholder="Name" value={v.name} onChange={e=>setV({...v,name:e.target.value})} required/><select className={cls} value={v.role} onChange={e=>setV({...v,role:e.target.value})}><option>manager</option><option>admin</option></select><input type="password" className={cls} placeholder="Temporary password" value={v.password} onChange={e=>setV({...v,password:e.target.value})} required/><button className={primary}>Add user</button></form><div className="glass border border-white/10 rounded-xl overflow-auto"><table className="w-full text-sm"><thead><tr className="text-slate-500 border-b border-white/10"><th className="p-3">Username</th><th>Name</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>{r.map(x=><tr className="border-b border-white/5" key={x.id}><td className="p-3">{x.username}</td><td>{x.name}</td><td>{x.role}</td><td>{x.active?'Active':'Disabled'}</td><td><button className={btn} onClick={()=>del(x.id)} disabled={!x.active}>Disable</button></td></tr>)}</tbody></table></div></div>}
