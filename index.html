<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%2308111f%27/%3E%3Cpath d=%27M16 20 32 12l16 8-16 8-16-8Zm0 0v24l16 8 16-8V20M24 24v24m16-24v24%27 fill=%27none%27 stroke=%27%2322c55e%27 stroke-width=%274%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      background: radial-gradient(circle at 15% 0%, rgba(34, 197, 94, 0.12), transparent 25%),
                  radial-gradient(circle at 85% 10%, rgba(6, 182, 212, 0.12), transparent 25%),
                  #070d18;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .glass {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.45));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .glass:hover { border-color: rgba(255, 255, 255, 0.15); }
    input, select, textarea {
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(34, 197, 94, 0.6) !important;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
      background: rgba(255, 255, 255, 0.08);
    }
    button { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    button:not(:disabled):hover { transform: translateY(-1px); }
    button:not(:disabled):active { transform: translateY(0); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .nav-item { position: relative; }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: linear-gradient(180deg, #22c55e, #06b6d4);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }
    .metric-card { position: relative; overflow: hidden; }
    .metric-card::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      right: -35px;
      bottom: -40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.12), transparent 70%);
      pointer-events: none;
    }
    .chart-shell {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.005));
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const API = window.__INVENTORY_API__ || '/api';
    let activeCharts = {};

    const inputStyle = 'w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm focus:bg-white/10 placeholder-slate-500 transition-all';
    const btnStyle = 'px-4 py-2.5 rounded-xl text-sm font-medium bg-white/10 hover:bg-white/15 border border-white/5 flex items-center justify-center gap-2';
    const primaryBtnStyle = btnStyle + ' bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-semibold border-none shadow-lg shadow-emerald-500/20';

    function formatMoney(n) {
      return new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' }).format(Number(n) || 0);
    }

    function Icon({ name, size = 18, stroke = 1.8, className = '' }) {
      const paths = {
        dashboard: <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
        products: <><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></>,
        warehouse: <><path d="M3 10 12 3l9 7v10H3V10Z"/><path d="M7 21v-7h10v7M7 10h.01M12 10h.01M17 10h.01"/></>,
        suppliers: <><circle cx="8" cy="8" r="3"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M16 11a3 3 0 1 0 0-6M15.5 15a5 5 0 0 1 5 5"/></>,
        bell: <><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></>,
        report: <><path d="M5 3h10l4 4v14H5V3Z"/><path d="M15 3v5h5M8 13h8M8 17h6M8 9h3"/></>,
        activity: <><path d="M3 12h4l2-7 4 14 2-7h6"/></>,
        users: <><circle cx="9" cy="8" r="3"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5.5a3 3 0 0 1 0 5.8M17 14a5 5 0 0 1 4.5 6"/></>,
        logout: <><path d="M10 17l5-5-5-5M15 12H3M13 3h6v18h-6"/></>,
        plus: <><path d="M12 5v14M5 12h14"/></>,
        download: <><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></>,
        trend: <><path d="M3 17l6-6 4 4 7-8"/><path d="M15 7h5v5"/></>,
        alert: <><path d="M12 3 2.8 19h18.4L12 3Z"/><path d="M12 9v4M12 16h.01"/></>,
        box: <><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Z"/><path d="m3 7 9 4 9-4M12 11v10"/></>,
        shield: <><path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Z"/><path d="m9 12 2 2 4-4"/></>
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || paths.box}
        </svg>
      );
    }

    async function apiRequest(path, token, opts = {}) {
      const res = await fetch(API + path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(opts.headers || {})
        },
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      if (!res.ok) {
        let err = 'Request failed';
        try { err = (await res.json()).error || err; } catch {}
        throw new Error(err);
      }
      const ct = res.headers.get('content-type') || '';
      return ct.includes('application/json') ? res.json() : res;
    }

    function Modal({ title, children, onClose }) {
      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 fade-in">
          <div className="glass rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-auto p-6 shadow-2xl border border-white/10">
            <div className="flex justify-between items-center mb-5 pb-3 border-b border-white/10">
              <h3 className="font-semibold text-lg tracking-tight">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl h-8 w-8 rounded-lg flex items-center justify-center hover:bg-white/10 transition-colors">×</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function Login({ done }) {
      const [u, setU] = useState('admin');
      const [p, setP] = useState('ChangeMe_123!');
      const [e, setE] = useState('');

      async function go(x) {
        x.preventDefault();
        try {
          const d = await apiRequest('/auth/login', null, { method: 'POST', body: { username: u, password: p } });
          done(d);
        } catch (err) {
          setE(err.message);
        }
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-5 relative overflow-hidden">
          <form onSubmit={go} className="glass rounded-3xl p-8 w-full max-w-md shadow-2xl border border-white/10 fade-in">
            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400/20 to-cyan-400/20 border border-white/10 flex items-center justify-center mb-4">
              <Icon name="box" size={28} className="text-emerald-400" />
            </div>
            <div className="text-3xl font-bold tracking-tight mb-1">Inventory</div>
            <p className="text-slate-400 text-sm mb-6">Secure portal access</p>
            
            <label className="text-xs font-medium text-slate-400">Username</label>
            <input className={inputStyle + ' mb-4 mt-1'} value={u} onChange={e => setU(e.target.value)} required />
            
            <label className="text-xs font-medium text-slate-400">Password</label>
            <input type="password" className={inputStyle + ' mb-5 mt-1'} value={p} onChange={e => setP(e.target.value)} required />
            
            {e && <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm mb-4">{e}</div>}
            
            <button className={primaryBtnStyle + ' w-full py-3 font-semibold'}>Sign In</button>
            <p className="text-xs text-slate-500 mt-6 text-center leading-relaxed">Configured via environment variables for production security.</p>
          </form>
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(() => {
        try { return JSON.parse(localStorage.session); } catch { return null; }
      });

      if (!session) return <Login done={d => { localStorage.session = JSON.stringify(d); setSession(d); }} />;
      return <Portal session={session} logout={() => { localStorage.removeItem('session'); setSession(null); }} />;
    }

    function Portal({ session, logout }) {
      const [page, setPage] = useState('dashboard');
      const [bump, setBump] = useState(0);
      const [notifs, setNotifs] = useState([]);

      useEffect(() => {
        apiRequest('/notifications', session.token).then(setNotifs).catch(() => {});
      }, [bump]);

      const nav = [
        ['dashboard', 'dashboard', 'Dashboard'],
        ['products', 'products', 'Products'],
        ['warehouses', 'warehouse', 'Warehouses'],
        ['suppliers', 'suppliers', 'Suppliers'],
        ['notifications', 'bell', 'Notifications'],
        ['reports', 'report', 'Reports'],
        ['activity', 'activity', 'Activity'],
        ...(session.user.role === 'admin' ? [['users', 'users', 'Users']] : [])
      ];

      function refresh() { setBump(x => x + 1); }

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          <aside className="w-full md:w-64 border-r border-white/10 bg-slate-950/60 backdrop-blur-xl p-4 flex flex-col justify-between shrink-0">
            <div>
              <div className="px-3 py-4 mb-4 flex items-center gap-3 border-b border-white/5">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center bg-gradient-to-br from-emerald-400/20 to-cyan-400/20 border border-white/10 shadow-lg shadow-emerald-500/10">
                  <Icon name="box" size={22} className="text-emerald-400" />
                </div>
                <div>
                  <div className="text-lg font-bold tracking-tight">Inventory</div>
                  <div className="text-[10px] uppercase tracking-[.2em] font-semibold text-slate-500">Control Center</div>
                </div>
              </div>
              <nav className="space-y-1">
                {nav.map(n => (
                  <button
                    key={n[0]}
                    onClick={() => setPage(n[0])}
                    className={'nav-item w-full text-left px-3.5 py-2.5 rounded-xl flex items-center gap-3 transition-all ' + (page === n[0] ? 'active bg-white/10 text-white font-medium' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200')}
                  >
                    <Icon name={n[1]} size={18} />
                    <span>{n[2]}</span>
                    {n[0] === 'notifications' && notifs.length ? (
                      <span className="ml-auto text-[10px] font-bold bg-rose-500 text-white rounded-full min-w-5 h-5 px-1.5 flex items-center justify-center shadow-lg shadow-rose-500/30">
                        {notifs.length}
                      </span>
                    ) : null}
                  </button>
                ))}
              </nav>
            </div>
            <div className="pt-4 border-t border-white/10 px-3 text-xs text-slate-500 flex items-center justify-between">
              <div>
                <p className="text-slate-300 font-medium">{session.user.name}</p>
                <p className="capitalize">{session.user.role}</p>
              </div>
            </div>
          </aside>

          <main className="flex-1 p-4 md:p-8 overflow-auto">
            <div className="flex justify-between items-center mb-8 pb-4 border-b border-white/5">
              <div>
                <h1 className="text-2xl font-bold tracking-tight capitalize">{nav.find(x => x[0] === page)?.[2]}</h1>
                <p className="text-xs text-slate-500 mt-1">Real-time status · {new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' })}</p>
              </div>
              <button onClick={logout} className={btnStyle + ' hover:bg-rose-500/10 hover:border-rose-500/20 hover:text-rose-400'}>
                <Icon name="logout" size={16} /> Logout
              </button>
            </div>

            {page === 'dashboard' && <Dashboard token={session.token} />}
            {page === 'products' && <Products token={session.token} user={session.user} bump={refresh} />}
            {page === 'warehouses' && <Warehouses token={session.token} user={session.user} />}
            {page === 'suppliers' && <Suppliers token={session.token} user={session.user} />}
            {page === 'notifications' && <Notifications token={session.token} openActivity={() => setPage('activity')} bump={refresh} />}
            {page === 'reports' && <Reports token={session.token} />}
            {page === 'activity' && <Activity token={session.token} />}
            {page === 'users' && session.user.role === 'admin' && <Users token={session.token} />}
          </main>
        </div>
      );
    }

    function Dashboard({ token }) {
      const [d, setD] = useState(null);
      const [start, setStart] = useState('');
      const [end, setEnd] = useState('');

      async function load() {
        setD(await apiRequest(`/dashboard${start || end ? `?start=${start}&end=${end}` : ''}`, token));
      }

      useEffect(() => { load(); }, [start, end]);

      useEffect(() => {
        const timer = setInterval(load, 60000);
        return () => clearInterval(timer);
      }, [start, end]);

      useEffect(() => {
        if (!d) return;

        Object.values(activeCharts).forEach(c => c?.destroy());
        activeCharts = {};

        const grid = { color: 'rgba(148, 163, 184, 0.08)', drawBorder: false };
        const ticks = { color: '#94a3b8', font: { size: 11 } };

        const ctx1 = document.getElementById('chart-movement');
        const ctx2 = document.getElementById('chart-cats');
        const ctx3 = document.getElementById('chart-health');

        if (ctx1) {
          const g = ctx1.getContext('2d').createLinearGradient(0, 0, 0, 260);
          g.addColorStop(0, 'rgba(34, 197, 94, 0.35)');
          g.addColorStop(1, 'rgba(34, 197, 94, 0)');

          activeCharts.a = new Chart(ctx1, {
            type: 'line',
            data: {
              labels: d.movement.map(x => new Date(x.day).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })),
              datasets: [{
                label: 'Quantity moved',
                data: d.movement.map(x => Number(x.quantity)),
                borderColor: '#4ade80',
                backgroundColor: g,
                fill: true,
                tension: 0.38,
                pointRadius: 3,
                pointHoverRadius: 6,
                pointBackgroundColor: '#4ade80',
                pointBorderColor: '#070d18',
                pointBorderWidth: 2,
                borderWidth: 2.5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { x: { grid, ticks }, y: { grid, ticks, beginAtZero: true } }
            }
          });
        }

        if (ctx2) {
          activeCharts.b = new Chart(ctx2, {
            type: 'bar',
            data: {
              labels: d.categories.map(x => x.category || 'Uncategorized'),
              datasets: [{
                label: 'Stock',
                data: d.categories.map(x => Number(x.stock)),
                backgroundColor: 'rgba(6, 182, 212, 0.75)',
                borderRadius: 8,
                maxBarThickness: 32
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { x: { grid: { display: false }, ticks }, y: { grid, ticks, beginAtZero: true } }
            }
          });
        }

        if (ctx3) {
          const total = Number(d.totals.total_stock) || 0;
          const low = Number(d.totals.low_stock) || 0;
          const healthy = Math.max(total - low, 0);

          activeCharts.c = new Chart(ctx3, {
            type: 'doughnut',
            data: {
              labels: ['Healthy Stock', 'Low Stock'],
              datasets: [{
                data: [healthy, low],
                backgroundColor: ['rgba(34, 197, 94, 0.85)', 'rgba(244, 63, 94, 0.85)'],
                borderColor: '#0f172a',
                borderWidth: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '75%',
              plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', padding: 16 } } }
            }
          });
        }
      }, [d]);

      if (!d) return <div className="p-8 text-center text-slate-500">Loading metrics…</div>;

      const metrics = [
        ['Products', d.totals.products, 'box'],
        ['Stock Units', d.totals.total_stock, 'warehouse'],
        ['Value', formatMoney(d.totals.inventory_value), 'trend'],
        ['Low Stock', d.totals.low_stock, 'alert'],
        ['Units Sold', d.sales.qty, 'products'],
        ['Profit', formatMoney(d.sales.profit), 'trend']
      ];

      return (
        <div className="fade-in space-y-6">
          <div className="flex flex-wrap gap-3 items-end glass p-4 rounded-2xl">
            <div>
              <label className="text-xs font-medium text-slate-400 block mb-1">Start Date</label>
              <input type="date" className={inputStyle} value={start} onChange={e => setStart(e.target.value)} />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-400 block mb-1">End Date</label>
              <input type="date" className={inputStyle} value={end} onChange={e => setEnd(e.target.value)} />
            </div>
            <button className={btnStyle} onClick={() => { setStart(''); setEnd(''); }}>Reset Period</button>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
            {metrics.map(x => (
              <div className="metric-card glass rounded-2xl p-
